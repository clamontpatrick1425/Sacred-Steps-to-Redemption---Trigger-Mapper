    <script>
      // Compatibility patch for iframe environments where window.fetch has only a getter
      (function() {
        try {
          var nativeFetch = window.fetch;
          var customFetch = nativeFetch ? function() {
            return nativeFetch.apply(window, arguments);
          } : undefined;

          // Provide both getter and setter on window
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var protoFetch = Window.prototype.fetch;
              var customProtoFetch = protoFetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return customProtoFetch;
                },
                set: function(fn) {
                  customProtoFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }
      })();
    </script>
